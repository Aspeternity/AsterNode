name: relay-manager-ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: relay-manager-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  stage-a-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends jq iproute2 util-linux openssl curl unzip shellcheck
      - name: Run Stage-A unit and static checks
        run: ./tests/run.sh --unit-only
